# Joystick controller switching. Set explicitly here (rather than relying on
# the compiled-in defaults, which differ between the upstream monorepo and
# lab 5). The map:
#   X = the default policy, circle = three-legged, triangle = original walk,
#   square = the student policy slot (deploy.sh installs there).
estop_controller:
  ros__parameters:
    switch_button_indices: [0, 1, 2, 3]
    controller_names:
      [
        "neural_controller_default",
        "neural_controller_three_legged",
        "neural_controller",
        "neural_controller_student",
      ]


teleop_twist_joy_node:
  ros__parameters:
    axis_linear:
      x: 1
      y: 0
    scale_linear:
      # Full stick = 1.5 m/s: the captured-reference mixed-gaits checkpoints
      # (run tryieau1 onward) train on the full +-1.5 band, with the fast
      # references distilled from what the robot actually does at 1.5. The
      # trot-to-fast switch comes from the policy JSON's gallop_speed (0.5),
      # i.e. a third of stick deflection.
      x: 1.5
      y: 0.5


    axis_angular:
      yaw: 3
    scale_angular:
      yaw: 2.0


    require_enable_button: false


joy_node:
  ros__parameters:
    dev: "/dev/input/js0"
    autorepeat_rate: 50.0
    coalesce_interval: 0.02


joint_state_broadcaster:
  ros__parameters:
    update_rate: 260
    use_local_topics: false


